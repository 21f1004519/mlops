name: Build and Push (to Artifact Registry)

on:
  push:
    branches: [ week6-ga ]
  workflow_dispatch:

env:
  PROJECT_ID: heroic-throne-473405-m8
  REGION: us-central1
  REPOSITORY: week6  # Artifact Registry repo name
  IMAGE: iris-fastapi

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Authenticate to Google Cloud
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_KEY" > gcp-key.json
          gcloud auth activate-service-account --key-file=gcp-key.json
          gcloud config set project ${{ env.PROJECT_ID }}
          export GOOGLE_APPLICATION_CREDENTIALS="gcp-key.json"

      - name: Configure docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Install dvc & pull data
        env:
         GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
        run: |
          pip install "dvc[gs]" 
          dvc pull

      - name: Train model (produces artifacts/model.joblib)
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
        run: |
          pip install -r requirements.txt
          python train.py

      - name: Build and Push Docker image
        id: build
        env:
         GOOGLE_APPLICATION_CREDENTIALS: gcp-key.json
        run: |
          IMAGE_URI=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "$IMAGE_URI" > image-info.txt

      - name: Commit image URI file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_image.txt
          git commit -m "Update latest image URI [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}



