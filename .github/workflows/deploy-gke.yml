---
name: Deploy to GKE and Stress Test

on:
  workflow_run:
    workflows: ["Build and Push (to Artifact Registry)"]
    types: [completed]
    branches: [week7-ga]

env:
  PROJECT_ID: heroic-throne-473405-m8
  CLUSTER: week7-cluster
  REGION: us-central1

jobs:
  deploy-and-stress-test:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image URI from file
        id: read
        run: |
          IMAGE=$(cat image-info.txt)
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Setup gcloud CLI
        id: 'auth'
        uses: 'google-github-actions/auth@v0'
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v0
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Deploy application to GKE
        env:
          NAMESPACE: default
        run: |
          set -euo pipefail
          echo "Deploying image: $IMAGE"
          kubectl config set-context --current --namespace=$NAMESPACE

          if kubectl get deployment iris-fastapi >/dev/null 2>&1; then
            echo "Deployment exists — updating image..."
            kubectl set image deployment/iris-fastapi iris-fastapi=$IMAGE --record
          else
            echo "Deployment not found — creating new one..."
            sed "s|<GCR_HOST>/<PROJECT_ID>/<REPO_NAME>:<IMAGE_TAG>|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
          fi

          kubectl apply -f k8s/service.yaml || true

          echo "Waiting for rollout..."
          # Wait for rollout — retry up to 3 times
          for i in {1..3}; do
            if kubectl rollout status deployment/iris-fastapi --timeout=180s; then
              echo "Rollout successful!"
              exit 0
            else
              echo "Rollout attempt $i failed, retrying..."
              sleep 10
            fi
          done   
          echo "Rollout failed after multiple attempts."
          kubectl describe deployment iris-fastapi
          kubectl get pods -o wide
          exit 1   

      - name: Apply HPA (Autoscaler)
        run: |
          echo "Applying Horizontal Pod Autoscaler..."
          kubectl apply -f k8s/hpa.yaml
          kubectl get hpa

      - name: Wait for Service to get external IP
        run: |
          echo "Waiting for external IP allocation..."
          for i in {1..20}; do
            EXTERNAL_IP=$(kubectl get svc iris-fastapi-svc -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$EXTERNAL_IP" ]; then
              echo "Service available at: http://$EXTERNAL_IP:8080"
              echo "EXTERNAL_IP=$EXTERNAL_IP" >> $GITHUB_ENV
              break
            fi
            echo "Waiting for IP (attempt $i)..."
            sleep 15
          done
          if [ -z "$EXTERNAL_IP" ]; then
            echo "Error: Service did not get an external IP."
            kubectl get svc iris-fastapi
            exit 1
          fi
      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Run stress test - AutoScaling enabled (3 pods)
        env:
          TARGET: ${{ env.EXTERNAL_IP }}
        run: |
          echo "Running wrk stress test with AutoScaling enabled..."
          wrk -t8 -c1000 -d30s http://$TARGET:8080/health > wrk_output_autoscale.txt
          echo "--- WRK RESULTS (Autoscale ON) ---"
          cat wrk_output_autoscale.txt

          echo "Checking pod scaling status..."
          kubectl get hpa
          kubectl get pods -o wide

      - name: Run stress test - Restricted to 1 pod
        env:
          TARGET: ${{ env.EXTERNAL_IP }}
        run: |
          echo "Restricting to 1 replica..."
          kubectl scale deployment iris-fastapi --replicas=1
          sleep 60
          echo "⚙️ Running wrk with concurrency 2000 (autoscaling OFF)..."
          wrk -t8 -c2000 -d30s http://$TARGET:8080/health > wrk_output_singlepod.txt

          echo "--- WRK RESULTS (Single Pod) ---"
          cat wrk_output_singlepod.txt

