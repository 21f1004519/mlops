---
name: Deploy to GKE

on:
  workflow_run:
    workflows: ["Build and Push (to Artifact Registry)"]
    types: [completed]
    branches: [week6-ga]

env:
  PROJECT_ID: heroic-throne-473405-m8
  CLUSTER: week6-cluster
  REGION: us-central1

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image URI from file
        id: read
        run: |
          IMAGE=$(cat image-info.txt)
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Setup gcloud CLI
        id: 'auth'
        uses: 'google-github-actions/auth@v0'
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' 

      -  name: Set up GKE credentials
         uses: google-github-actions/get-gke-credentials@v0
         with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
      
      - name: Deploy to GKE
        run: |
          echo "Deploying image: $IMAGE"
          if kubectl get deployment iris-fastapi >/dev/null 2>&1; then
            echo "Deployment exists, updating image..."
            kubectl set image deployment/iris-fastapi iris-fastapi=$IMAGE --record
          else
            echo "Deployment not found, creating fresh deployment..."
            sed "s|<GCR_HOST>/<PROJECT_ID>/<REPO_NAME>:<IMAGE_TAG>|$IMAGE|" k8s/deployment.yaml | kubectl apply -f -
          fi
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/iris-fastapi --timeout=120s
