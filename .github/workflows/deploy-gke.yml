---
name: Deploy to GKE

on:
  workflow_run:
    workflows: ["Build and Push (to Artifact Registry)"]
    types: [completed]
    branches: [week6-ga]

env:
  PROJECT_ID: heroic-throne-473405-m8
  CLUSTER: week6-cluster
  REGION: us-central1

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read image URI from file
        id: read
        run: |
          IMAGE=$(cat image-info.txt)
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Setup gcloud CLI
        id: 'auth'
        uses: 'google-github-actions/auth@v0'
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}' 

      -  name: Set up GKE credentials
         uses: google-github-actions/get-gke-credentials@v0
         with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}
      
      - name: Deploy to GKE
        env:
          NAMESPACE: default
        run: |
          set -euo pipefail
          echo "Deploying image: $IMAGE"
      
          # Ensure context and namespace
          kubectl config get-contexts
          kubectl config set-context --current --namespace=$NAMESPACE
      
          # Check if deployment exists
          if kubectl get deployment iris-fastapi >/dev/null 2>&1; then
            echo "Deployment exists — updating image..."
            kubectl set image deployment/iris-fastapi iris-fastapi=$IMAGE --record
          else
            echo "Deployment not found — creating a new one..."
            sed "s|<GCR_HOST>/<PROJECT_ID>/<REPO_NAME>:<IMAGE_TAG>|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
          fi
      
          # Apply service (safe reapply)
          echo "Applying service..."
          kubectl apply -f k8s/service.yaml || echo "Service apply failed, continuing..."
      
          # Wait for rollout — retry up to 3 times
          echo "Waiting for rollout..."
          for i in {1..3}; do
            if kubectl rollout status deployment/iris-fastapi --timeout=180s; then
              echo "Rollout successful!"
              exit 0
            else
              echo "Rollout attempt $i failed, retrying..."
              sleep 10
            fi
          done   
          echo "Rollout failed after multiple attempts."
          kubectl describe deployment iris-fastapi
          kubectl get pods -o wide
          exit 1   
